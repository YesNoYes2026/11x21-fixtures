<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11x21 fixture pull</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:12px;background:#111;color:#eee}
  h1{color:#ffb000}
  input,button,textarea{font-size:15px;padding:8px;margin:4px 0;width:100%;box-sizing:border-box;border-radius:6px;border:1px solid #333;background:#222;color:#eee}
  button{background:#ffb000;color:#111;border:0;font-weight:bold}
  textarea{height:260px;font-family:monospace;font-size:12px}
  .muted{color:#999;font-size:13px}
  .warn{color:#ff8a65}
</style>
</head>
<body>
<h1>Fixtures to SQL (KSA time)</h1>
<p class="muted">Paste your API-Football key below. It is used only in this browser session and is not saved.</p>
<input id="key" type="password" placeholder="API-Football key">
<button onclick="run()">Pull fixtures 12–15 Nov 2026</button>
<div id="status" class="muted"></div>
<div id="skipped" class="warn"></div>
<textarea id="out" placeholder="SQL appears here"></textarea>
<button onclick="copyOut()">Copy SQL</button>

<script>
const DAYS = ['2026-11-12', '2026-11-13', '2026-11-14', '2026-11-15'];
const KSA_MS = 3 * 60 * 60 * 1000;
const BAD = ['PST', 'CANC', 'ABD', 'AWD', 'WO'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/'/g, "''");

// Format a Date as KSA (UTC+3) ISO string with explicit offset.
function ksaIso(d) {
  const t = new Date(d.getTime() + KSA_MS);
  const p = n => String(n).padStart(2, '0');
  return `${t.getUTCFullYear()}-${p(t.getUTCMonth() + 1)}-${p(t.getUTCDate())}T${p(t.getUTCHours())}:${p(t.getUTCMinutes())}:00+03:00`;
}
function ksaDay(d) {
  return ksaIso(d).slice(0, 10);
}

async function fetchDay(key, day) {
  const r = await fetch(`https://v3.football.api-sports.io/fixtures?date=${day}`, {
    headers: { 'x-apisports-key': key }
  });
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${day}`);
  const j = await r.json();
  if (j.errors && Object.keys(j.errors).length) throw new Error(JSON.stringify(j.errors));
  return j.response || [];
}

function isInternational(f) {
  const l = f.league || {};
  return l.country === 'World' || /friendl|nations league|world cup|qualif/i.test(l.name || '');
}

async function run() {
  const key = $('key').value.trim();
  if (!key) return alert('Paste your API key first.');
  $('out').value = '';
  $('skipped').textContent = '';
  $('status').textContent = 'Fetching…';

  const seen = new Set();
  const rows = [];
  const skipped = [];
  try {
    for (const day of DAYS) {
      const list = await fetchDay(key, day);
      for (const f of list) {
        if (!isInternational(f)) continue;
        const d = new Date(f.fixture.date);
        if (!['2026-11-12', '2026-11-13', '2026-11-14', '2026-11-15'].includes(ksaDay(d))) continue;
        if (seen.has(f.fixture.id)) continue;
        seen.add(f.fixture.id);
        const label = `${f.league.name}: ${f.teams.home.name} v ${f.teams.away.name}`;
        if (BAD.includes(f.fixture.status.short)) {
          skipped.push(`${label} (status ${f.fixture.status.short})`);
          continue;
        }
        rows.push({
          id: 'api' + f.fixture.id,
          league: f.league.name,
          home: f.teams.home.name,
          away: f.teams.away.name,
          kickoff: ksaIso(d),
          label: label + ' | KSA ' + ksaIso(d).replace('T', ' ').slice(0, 16)
        });
      }
    }
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
    return;
  }

  rows.sort((a, b) => a.kickoff.localeCompare(b.kickoff));
  $('status').textContent = `${rows.length} matches found, sorted by KSA kickoff. Check the list before running the SQL.`;
  $('skipped').textContent = skipped.length ? 'Skipped (postponed/cancelled): ' + skipped.join('; ') : '';

  const values = rows.map(r =>
    `('${esc(r.id)}', '${esc(r.league)}', '${esc(r.home)}', '${esc(r.away)}', '${r.kickoff}')`
  );
  $('out').value = rows.map(r => '-- ' + r.label).join('\n') + '\n\n' +
    (values.length
      ? `insert into matches (id, league, home, away, kickoff) values\n${values.join(',\n')}\non conflict (id) do nothing;`
      : '-- no matches found');
}

function copyOut() {
  $('out').select();
  document.execCommand('copy');
  $('status').textContent = 'SQL copied. Paste it into Supabase SQL Editor.';
}
</script>
</body>
</html>
